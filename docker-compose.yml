services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: golearn
      POSTGRES_USER: golearn
      POSTGRES_PASSWORD: golearn
    ports:
      - "5433:5432"
    volumes:
      - golearn_data:/var/lib/postgresql/data
      - ./migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./migrations/002_tracks_difficulty.up.sql:/docker-entrypoint-initdb.d/002_tracks.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golearn"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: golearn
      RUSTFS_SECRET_KEY: golearn123
      RUSTFS_VOLUMES: /data
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - golearn_objects:/data
    healthcheck:
      # No dedicated health endpoint: an unsigned request answers 403, which already proves
      # the S3 router is up, so the check only requires an HTTP answer.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000/"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  golearn_data:
  golearn_objects:
