services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: golearn
      POSTGRES_USER: golearn
      POSTGRES_PASSWORD: golearn
    ports:
      - "5433:5432"
    volumes:
      - golearn_data:/var/lib/postgresql/data
      - ./migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./migrations/002_tracks_difficulty.up.sql:/docker-entrypoint-initdb.d/002_tracks.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golearn"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: golearn
      MINIO_ROOT_PASSWORD: golearn123
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - golearn_objects:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  golearn_data:
  golearn_objects:
