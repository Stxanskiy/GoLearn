apiVersion: v1
kind: ConfigMap
metadata:
  name: golearn-config
  namespace: golearn
data:
  DATABASE_URL: "postgres://golearn:golearn@postgres:5432/golearn?sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: golearn-secrets
  namespace: golearn
type: Opaque
stringData:
  db-password: "golearn"
  S3_ENDPOINT: "minio:9000"
  S3_BUCKET: "golearn"
  S3_PUBLIC_URL: "https://learn.prod-factory.ru/media/golearn"
