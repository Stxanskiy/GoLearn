apiVersion: apps/v1
kind: Deployment
metadata:
  name: golearn
  namespace: golearn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golearn
  template:
    metadata:
      labels:
        app: golearn
    spec:
      initContainers:
      # Run migrations before app starts
      - name: migrate
        image: golearn:latest
        imagePullPolicy: Never
        command: ["/app/seed"]
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: golearn-config
              key: DATABASE_URL
      containers:
      - name: golearn
        image: golearn:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: golearn-config
              key: DATABASE_URL
        - name: PORT
          value: "8080"
        - name: TEMPLATE_DIR
          value: "/templates"
        - name: STATIC_DIR
          value: "/static"
        - name: DATA_DIR
          value: "/tmp/data"
        readinessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: golearn
  namespace: golearn
spec:
  type: NodePort
  selector:
    app: golearn
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
