apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-pvc
  namespace: golearn
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: golearn
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      # The image runs as uid 10001; fsGroup hands it the PVC.
      securityContext:
        fsGroup: 10001
      containers:
      - name: rustfs
        image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
        ports:
        - containerPort: 9000
          name: s3
        - containerPort: 9001
          name: console
        env:
        - name: RUSTFS_VOLUMES
          value: /data
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: golearn-secrets
              key: S3_ACCESS_KEY
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: golearn-secrets
              key: S3_SECRET_KEY
        volumeMounts:
        - name: data
          mountPath: /data
        # RustFS has no health endpoint — an unsigned request answers 403, which an
        # httpGet probe counts as a failure — so the probes check the S3 port instead.
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rustfs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: golearn
spec:
  selector:
    app: rustfs
  ports:
  - name: s3
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
