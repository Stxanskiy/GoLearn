# GoLearn LMS — learn.prod-factory.ru on Berg.
# TLS terminated here on :8445; reached via :443 nginx stream SNI router
# (stream.d/sni-routing.conf: learn.prod-factory.ru -> 127.0.0.1:8445).
# App container listens on 127.0.0.1:8081 (golearn:local).

server {
    listen 8445 ssl;
    server_name learn.prod-factory.ru;

    ssl_certificate /etc/letsencrypt/live/learn.prod-factory.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.prod-factory.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        auth_basic "GoLearn";
        auth_basic_user_file /etc/nginx/.golearn.htpasswd;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        client_max_body_size 20M;
    }
}

server {
    listen 80;
    server_name learn.prod-factory.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
