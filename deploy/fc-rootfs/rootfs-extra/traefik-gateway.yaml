# Turn on Traefik's Gateway API provider.
#
# k3s installs Traefik from a HelmChart, and this HelmChartConfig is how its
# values are overridden. It sits next to the Gateway API CRDs in the manifests
# directory so both are applied before Traefik's install job runs — the provider
# refuses to start if the CRDs are not there yet.
#
# gateway.enabled stays false on purpose: the chart would otherwise create a
# Gateway of its own, and the lesson is about creating one.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: false
