name: ci

# One pipeline: tests gate the release. Until these were two workflows, ci.yml
# carried `branches-ignore: [main]` while deploy.yml triggered on main, so the
# one branch that reaches production was the one branch nobody tested.
#
# test runs GitHub-hosted on purpose: the self-hosted "berg" runner is the
# production box, and a test run has no business competing with the site for it.
# deploy needs that runner because the image is built and imported there.

on:
  push:
  pull_request:
  # Restored from the old deploy.yml: a release can fail on something that has
  # nothing to do with the commit - the last one died on an ETIMEDOUT from the
  # npm registry - and then it has to be possible to just run it again.
  workflow_dispatch:

concurrency:
  # Never cancel a release half-way through: the cluster would be left pointing
  # at an image whose import never finished. Feature branches are free to cancel.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A docs-only commit used to rebuild the image and recreate the pod, and the
  # deployment is Recreate, so the site blinked for a .md edit. deploy.yml said
  # this with `paths-ignore`, which a job cannot use - hence the explicit check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if [ "$(git rev-list --count HEAD)" -lt 2 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only HEAD^ HEAD \
             | grep -qvE '^(docs/|.*\.md$|\.gitignore$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # AWS's mirror of the Docker official image, not Docker Hub itself.
        # GitHub's runners share outbound addresses, so an anonymous pull from
        # Docker Hub lands on a rate limit that has nothing to do with this
        # repository's traffic - run 30 died on
        # "toomanyrequests: You have reached your unauthenticated pull rate
        # limit" before a single test ran. The mirror is the same image, needs
        # no credentials, and is not rate limited for anonymous pulls.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: golearn
          POSTGRES_PASSWORD: golearn
          POSTGRES_DB: golearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U golearn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The repository tests apply migrations/ to this empty database themselves.
      TEST_DATABASE_URL: postgres://golearn:golearn@localhost:5432/golearn_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The spec defines the types, so a stale types.gen.go means the handlers
      # compile against a contract that no longer exists. Nothing enforced this
      # before; it stayed in sync by hand.
      - name: OpenAPI types are up to date
        run: |
          go generate ./internal/api/apigen
          git diff --exit-code -- internal/api/apigen

      # api/redocly.yaml was committed but never run. Switching it on found two
      # descriptions truncated by an unquoted comma inside a YAML flow mapping,
      # which had also planted junk properties in two schemas.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@2 lint --config api/redocly.yaml api/openapi.yaml

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      # The database tests skip when they cannot reach a database, which would
      # keep this job green while checking nothing. Here a skip is a failure.
      - name: Database tests actually ran
        run: |
          set -o pipefail
          out=$(go test -count=1 -v ./internal/repository/)
          if grep -- '--- SKIP' <<<"$out"; then
            echo "::error::database tests were skipped - TEST_DATABASE_URL is not reachable"
            exit 1
          fi

  deploy:
    # The gate. Without `needs` a red test run still shipped.
    needs: [changes, test]
    # A manual run always deploys: it exists to retry a release, so the
    # docs-only skip must not swallow it.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.code == 'true'))
    runs-on: [self-hosted, berg]
    concurrency:
      group: deploy-berg
      cancel-in-progress: false
    steps:
      # Checkout WITHOUT actions/checkout. The self-hosted runner repeatedly
      # failed to download the action from GitHub's CDN ("Failed to resolve
      # action download info / HTTP request timed out"), which blocked every
      # deploy. A plain git checkout needs no action download, so an Actions CDN
      # hiccup can no longer stop a release. Auth uses the ephemeral GITHUB_TOKEN,
      # exactly like actions/checkout does.
      - name: Checkout ${{ github.sha }} (no action download)
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          AUTH="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if [ -d .git ]; then
            git remote set-url origin "$AUTH"
          else
            git init -q
            git remote add origin "$AUTH"
          fi
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout -f "$GITHUB_SHA"
          git clean -ffdx

      - name: Sync source to /opt/golearn/src
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='output' \
            --exclude='vibibay-brain' \
            --exclude='data' \
            ./ /opt/golearn/src/

      - name: Build, migrate, seed, deploy
        run: |
          exec > >(tee -a /tmp/ci-deploy.log) 2>&1
          echo "===== deploy run $(date -u) ====="
          id; echo "PATH=$PATH"
          set -x   # trace commands so a failure points at the exact one
          docker version --format 'server={{.Server.Version}}' || echo "!! DOCKER ACCESS FAIL"
          docker compose version || echo "!! COMPOSE FAIL"
          set -e
          cd /opt/golearn
          cp src/deploy/berg/docker-compose.yml docker-compose.yml
          docker compose build
          # Ensure DB is up. Migrations are applied by the app itself
          # (internal/migrate, tracked in schema_migrations) — applying them here
          # too would run every file a second time without recording it.
          docker compose up -d db
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' golearn-db 2>/dev/null)" = healthy ] && break
            sleep 2
          done
          docker compose run --rm app /app/seed
          docker compose up -d --force-recreate app
          # `up -d` returns once the container exists, not once the app serves:
          # it still has to connect to the database, apply migrations and start
          # listening. Wait for readiness instead of racing it.
          # Probe /healthz, not a page: the backend is a JSON API and serves no
          # HTML at all, so the old /login check returned 404 forever and took the
          # whole job down with it — including the cluster release step below.
          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/healthz || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          echo "deploy check /healthz -> ${code:-none}"
          [ "$code" = 200 ]

      # The public site (learn.prod-factory.ru) is NOT this compose stack: it is
      # a k3s deployment behind Traefik, reconciled by ArgoCD from
      # Stxanskiy/vibiay_manifests. A release is therefore a git change in that
      # repo — never a mutation of the running image.
      - name: Release to the cluster (GitOps)
        run: |
          exec > >(tee -a /tmp/ci-release.log) 2>&1
          set -x
          set -e
          # Without pipefail a failing `docker save` is masked by the exit code of
          # `ctr import`, and the release marches on with no image.
          set -o pipefail
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # There is no registry on this box, so the image is built here and
          # imported into k3s containerd. It has to exist there BEFORE git
          # points at it, or ArgoCD would roll out a tag nothing can pull.
          cd /opt/golearn
          docker build -t "golearn:$SHA" ./src
          docker save "golearn:$SHA" | sudo k3s ctr images import -

          # Prove the import actually landed. imagePullPolicy is IfNotPresent and
          # there is no registry, so a missing tag means every future pod lands in
          # ImagePullBackOff — and the running pod hides it until it restarts.
          # Capture the list before searching it: `grep -q` exits on the first
          # match, `ctr` then dies of SIGPIPE, and pipefail turns a found image
          # into "not in containerd" (run 117).
          refs=$(sudo k3s ctr images ls -q)
          if ! grep -qx "docker.io/library/golearn:$SHA" <<<"$refs"; then
            echo "!! golearn:$SHA is not in containerd - refusing to point git at it"
            exit 1
          fi

          # Declare the version in the manifests repo; ArgoCD applies it.
          rm -rf /tmp/gl-manifests
          git clone -q git@github.com:Stxanskiy/vibiay_manifests.git /tmp/gl-manifests
          cd /tmp/gl-manifests
          sed -i "s|^\( *image: \)golearn:.*|\1golearn:$SHA|" golearn/golearn-deployment.yml
          if git diff --quiet; then
            echo "manifests already reference golearn:$SHA"
          else
            git -c user.name="golearn-ci" -c user.email="ci@prod-factory.ru" \
                commit -am "golearn: release $SHA"
            git push origin main
          fi

          # Nudge ArgoCD instead of waiting out its poll interval.
          sudo k3s kubectl -n argocd annotate application golearn \
              argocd.argoproj.io/refresh=normal --overwrite >/dev/null
          for i in $(seq 1 60); do
            img=$(sudo k3s kubectl -n golearn get deploy golearn \
                  -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            [ "$img" = "golearn:$SHA" ] && break
            sleep 5
          done
          sudo k3s kubectl -n golearn rollout status deploy/golearn --timeout=180s

          # Course content lives in the cluster's own database.
          sudo k3s kubectl -n golearn exec deploy/golearn -- /app/seed | tail -1

          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://learn.prod-factory.ru/ || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          echo "public check https://learn.prod-factory.ru/ -> ${code:-none}"
          [ "$code" = 200 ]

          # Keep the last few releases importable for a quick rollback, drop older ones.
          # Tags are commit hashes, so a plain `sort` is alphabetical, not
          # chronological: it kept whichever hashes started with the highest hex
          # digits and deleted the release just deployed. The cluster was then left
          # pointing at a tag nothing could pull, which only surfaced on the next
          # pod restart. Order by build time instead, and never drop what is live.
          CURRENT=$(sudo k3s kubectl -n golearn get deploy golearn \
                    -o jsonpath='{.spec.template.spec.containers[0].image}' \
                    2>/dev/null | sed 's/^golearn://')
          KEEP=$(printf '%s\n%s\n%s\n' \
                 "$(sudo docker images --filter reference='golearn' \
                    --format '{{.CreatedAt}}|{{.Tag}}' | grep -v '|local$' \
                    | sort -r | head -5 | cut -d'|' -f2)" "$CURRENT" local)
          for ref in $(sudo k3s ctr images ls -q 2>/dev/null \
                       | grep '^docker.io/library/golearn:'); do
            # Same SIGPIPE trap as above, and here a false miss deletes a kept image.
            grep -qx "${ref##*:}" <<<"$KEEP" \
              || sudo k3s ctr images rm "$ref" >/dev/null || true
          done

      - name: Diagnostics on failure
        if: failure()
        run: |
          {
            echo '## deploy failed'
            echo '### tail of /tmp/ci-deploy.log'
            echo '```'
            tail -n 80 /tmp/ci-deploy.log 2>/dev/null || echo '(no log file)'
            echo '```'
            echo '### tail of /tmp/ci-release.log'
            echo '```'
            tail -n 80 /tmp/ci-release.log 2>/dev/null || echo '(no log file)'
            echo '```'
            echo '### cluster'
            echo '```'
            sudo k3s kubectl -n golearn get pods 2>&1 | head -6
            sudo k3s kubectl -n argocd get application golearn 2>&1 | head -3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
