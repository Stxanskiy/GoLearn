name: deploy

# CD via a self-hosted GitHub Actions runner running on the Berg server
# (label "berg"). The runner executes locally, so no inbound SSH / cloud-stored
# key is needed. It syncs the checkout into /opt/golearn/src and redeploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-berg
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, berg]
    steps:
      # Checkout WITHOUT actions/checkout. The self-hosted runner repeatedly
      # failed to download the action from GitHub's CDN ("Failed to resolve
      # action download info / HTTP request timed out"), which blocked every
      # deploy. A plain git checkout needs no action download, so an Actions CDN
      # hiccup can no longer stop a release. Auth uses the ephemeral GITHUB_TOKEN,
      # exactly like actions/checkout does.
      - name: Checkout ${{ github.sha }} (no action download)
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          AUTH="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if [ -d .git ]; then
            git remote set-url origin "$AUTH"
          else
            git init -q
            git remote add origin "$AUTH"
          fi
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout -f "$GITHUB_SHA"
          git clean -ffdx

      - name: Sync source to /opt/golearn/src
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='output' \
            --exclude='vibibay-brain' \
            --exclude='data' \
            ./ /opt/golearn/src/

      - name: Build, migrate, seed, deploy
        run: |
          exec > >(tee -a /tmp/ci-deploy.log) 2>&1
          echo "===== deploy run $(date -u) ====="
          id; echo "PATH=$PATH"
          set -x   # trace commands so a failure points at the exact one
          docker version --format 'server={{.Server.Version}}' || echo "!! DOCKER ACCESS FAIL"
          docker compose version || echo "!! COMPOSE FAIL"
          set -e
          cd /opt/golearn
          cp src/deploy/berg/docker-compose.yml docker-compose.yml
          docker compose build
          # Ensure DB is up. Migrations are applied by the app itself
          # (internal/migrate, tracked in schema_migrations) — applying them here
          # too would run every file a second time without recording it.
          docker compose up -d db
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' golearn-db 2>/dev/null)" = healthy ] && break
            sleep 2
          done
          docker compose run --rm app /app/seed
          docker compose up -d --force-recreate app
          # `up -d` returns once the container exists, not once the app serves:
          # it still has to connect to the database, apply migrations and start
          # listening. Wait for readiness instead of racing it.
          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/login || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          echo "deploy check /login -> ${code:-none}"
          [ "$code" = 200 ]

      # The public site (learn.prod-factory.ru) is NOT this compose stack: it is
      # a k3s deployment behind Traefik, reconciled by ArgoCD from
      # Stxanskiy/vibiay_manifests. A release is therefore a git change in that
      # repo — never a mutation of the running image.
      - name: Release to the cluster (GitOps)
        run: |
          exec > >(tee -a /tmp/ci-release.log) 2>&1
          set -x
          set -e
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # There is no registry on this box, so the image is built here and
          # imported into k3s containerd. It has to exist there BEFORE git
          # points at it, or ArgoCD would roll out a tag nothing can pull.
          cd /opt/golearn
          docker build -t "golearn:$SHA" ./src
          docker save "golearn:$SHA" | sudo k3s ctr images import -

          # Declare the version in the manifests repo; ArgoCD applies it.
          rm -rf /tmp/gl-manifests
          git clone -q git@github.com:Stxanskiy/vibiay_manifests.git /tmp/gl-manifests
          cd /tmp/gl-manifests
          sed -i "s|^\( *image: \)golearn:.*|\1golearn:$SHA|" golearn/golearn-deployment.yml
          if git diff --quiet; then
            echo "manifests already reference golearn:$SHA"
          else
            git -c user.name="golearn-ci" -c user.email="ci@prod-factory.ru" \
                commit -am "golearn: release $SHA"
            git push origin main
          fi

          # Nudge ArgoCD instead of waiting out its poll interval.
          sudo k3s kubectl -n argocd annotate application golearn \
              argocd.argoproj.io/refresh=normal --overwrite >/dev/null
          for i in $(seq 1 60); do
            img=$(sudo k3s kubectl -n golearn get deploy golearn \
                  -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            [ "$img" = "golearn:$SHA" ] && break
            sleep 5
          done
          sudo k3s kubectl -n golearn rollout status deploy/golearn --timeout=180s

          # Course content lives in the cluster's own database.
          sudo k3s kubectl -n golearn exec deploy/golearn -- /app/seed | tail -1

          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://learn.prod-factory.ru/ || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          echo "public check https://learn.prod-factory.ru/ -> ${code:-none}"
          [ "$code" = 200 ]

          # Keep the last few releases importable for a quick rollback, drop older ones.
          sudo k3s ctr images ls -q 2>/dev/null | grep '^docker.io/library/golearn:' \
            | grep -v ':local$' | sort | head -n -5 \
            | xargs -r -n1 sudo k3s ctr images rm >/dev/null || true

      - name: Diagnostics on failure
        if: failure()
        run: |
          {
            echo '## deploy failed'
            echo '### tail of /tmp/ci-deploy.log'
            echo '```'
            tail -n 80 /tmp/ci-deploy.log 2>/dev/null || echo '(no log file)'
            echo '```'
            echo '### tail of /tmp/ci-release.log'
            echo '```'
            tail -n 80 /tmp/ci-release.log 2>/dev/null || echo '(no log file)'
            echo '```'
            echo '### cluster'
            echo '```'
            sudo k3s kubectl -n golearn get pods 2>&1 | head -6
            sudo k3s kubectl -n argocd get application golearn 2>&1 | head -3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
