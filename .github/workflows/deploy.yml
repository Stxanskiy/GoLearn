name: deploy

# CD via a self-hosted GitHub Actions runner running on the Berg server
# (label "berg"). The runner executes locally, so no inbound SSH / cloud-stored
# key is needed. It syncs the checkout into /opt/golearn/src and redeploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-berg
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, berg]
    steps:
      - uses: actions/checkout@v4

      - name: Sync source to /opt/golearn/src
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='output' \
            --exclude='vibibay-brain' \
            --exclude='data' \
            ./ /opt/golearn/src/

      - name: Build, migrate, seed, deploy
        run: |
          exec > >(tee -a /tmp/ci-deploy.log) 2>&1
          echo "===== deploy run $(date -u) ====="
          id; echo "PATH=$PATH"
          set -x   # trace commands so a failure points at the exact one
          docker version --format 'server={{.Server.Version}}' || echo "!! DOCKER ACCESS FAIL"
          docker compose version || echo "!! COMPOSE FAIL"
          set -e
          cd /opt/golearn
          cp src/deploy/berg/docker-compose.yml docker-compose.yml
          docker compose build
          # Ensure DB is up. Migrations are applied by the app itself
          # (internal/migrate, tracked in schema_migrations) — applying them here
          # too would run every file a second time without recording it.
          docker compose up -d db
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' golearn-db 2>/dev/null)" = healthy ] && break
            sleep 2
          done
          docker compose run --rm app /app/seed
          docker compose up -d --force-recreate app
          curl -sf -o /dev/null -w "deploy check /login -> %{http_code}\n" http://127.0.0.1:8081/login

      # The runner's logs need repo-admin rights to download, so on failure the
      # diagnostics are published into the job summary instead — that is readable
      # through the check-runs API.
      - name: Diagnostics on failure
        if: failure()
        run: |
          {
            echo '## deploy failed'
            echo '### tail of /tmp/ci-deploy.log'
            echo '```'
            tail -n 120 /tmp/ci-deploy.log 2>/dev/null || echo '(no log file)'
            echo '```'
            echo '### disk'
            echo '```'
            df -h / 2>/dev/null | head -3
            docker system df 2>&1 | head -6
            echo '```'
            echo '### containers'
            echo '```'
            docker ps -a --filter name=golearn --format '{{.Names}} {{.Status}}' 2>&1 | head -10
            echo '```'
            echo '### compose logs'
            echo '```'
            (cd /opt/golearn && docker compose logs --tail=40 2>&1 | tail -60) || echo '(no compose logs)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
