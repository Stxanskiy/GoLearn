{{define "base"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.PageTitle}}</title>
    <style>
        :root {
            --bg: #0a0c10;
            --bg-secondary: #0f131a;
            --bg-card: #141a22;
            --bg-elevated: #1a212b;
            --border: #232b36;
            --border-strong: #303a48;
            --text: #e6edf3;
            --text-muted: #9aa7b4;
            --text-dim: #6b7785;
            --accent: #6ea8ff;
            --accent-hover: #8cbcff;
            --accent-2: #b98cff;
            --green: #3fb950;
            --green-bg: #0e2a17;
            --yellow: #e3b341;
            --yellow-bg: #2a2009;
            --red: #f85149;
            --red-bg: #2c1011;
            --purple: #bc8cff;
            --code-bg: #0b0e13;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 28px rgba(0,0,0,.45);
            --grad: linear-gradient(135deg, #6ea8ff 0%, #b98cff 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background:
                radial-gradient(900px 500px at 100% -10%, rgba(110,168,255,.08), transparent 60%),
                radial-gradient(800px 500px at -10% 0%, rgba(185,140,255,.07), transparent 55%),
                var(--bg);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.65;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

        a { color: var(--accent); }

        /* Navigation */
        nav {
            background: rgba(12,15,20,.72);
            backdrop-filter: saturate(160%) blur(12px);
            -webkit-backdrop-filter: saturate(160%) blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .container { display: flex; align-items: center; gap: 8px; }
        nav .logo {
            font-size: 1.25em;
            font-weight: 800;
            letter-spacing: -.02em;
            text-decoration: none;
            margin-right: 16px;
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        nav .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: .92em;
            font-weight: 500;
            padding: 7px 12px;
            border-radius: 999px;
            transition: color .18s, background .18s;
        }
        nav .nav-link:hover { color: var(--text); background: var(--bg-elevated); }
        nav .nav-link.active { color: var(--text); background: rgba(110,168,255,.14); }
        nav .spacer { margin-left: auto; }

        main { padding: 32px 0 64px; }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 16px;
            transition: border-color .2s, transform .2s, box-shadow .2s;
        }
        .card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow); }

        h1, h2, h3 { letter-spacing: -.01em; }

        /* Page heading */
        .page-head { margin-bottom: 28px; }
        .page-head h1 { font-size: 1.9em; font-weight: 800; }
        .page-head p { color: var(--text-muted); margin-top: 6px; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--grad); opacity: .8;
        }
        .stat-value {
            font-size: 2.4em;
            font-weight: 800;
            line-height: 1.1;
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .stat-label { color: var(--text-muted); font-size: .88em; margin-top: 6px; }

        /* Progress bar */
        .progress-bar { background: var(--bg); border-radius: 999px; height: 8px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: var(--grad); border-radius: 999px; transition: width .6s cubic-bezier(.4,0,.2,1); }

        /* Badges & chips */
        .badge { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: .78em; font-weight: 600; }
        .badge-completed { background: var(--green-bg); color: var(--green); border: 1px solid rgba(63,185,80,.4); }
        .badge-in-progress { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(227,179,65,.4); }
        .badge-not-started { background: var(--bg); color: var(--text-dim); border: 1px solid var(--border); }
        .chip { display:inline-block; padding:2px 9px; border-radius:999px; font-size:.72em; font-weight:600; border:1px solid var(--border-strong); color:var(--text-muted); }
        .chip-devops { color:#7ee0c0; border-color:rgba(126,224,192,.35); background:rgba(126,224,192,.08); }
        .chip-backend { color:#6ea8ff; border-color:rgba(110,168,255,.35); background:rgba(110,168,255,.08); }
        .chip-shared { color:#b98cff; border-color:rgba(185,140,255,.35); background:rgba(185,140,255,.08); }
        .chip-security { color:#f87171; border-color:rgba(248,113,113,.35); background:rgba(248,113,113,.08); }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 18px; border-radius: var(--radius-sm);
            font-size: .92em; font-weight: 600; text-decoration: none; cursor: pointer;
            border: 1px solid var(--border-strong); color: var(--text); background: var(--bg-elevated);
            transition: transform .15s, box-shadow .15s, background .15s, border-color .15s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: var(--grad); color: #0a0c10; border: none; font-weight: 700; }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(110,168,255,.35); }
        .btn-success { background: var(--green); color: #04140a; border: none; }
        .btn-outline { background: transparent; }
        .btn-outline:hover { background: var(--bg-elevated); border-color: var(--accent); }
        .btn-ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
        .btn-ghost:hover { color: var(--text); background: var(--bg-elevated); }

        /* Lesson list */
        .lesson-list { list-style: none; }
        .lesson-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            transition: background .18s; border-radius: 8px;
        }
        .lesson-item:hover { background: var(--bg-secondary); }
        .lesson-item:last-child { border-bottom: none; }
        .lesson-num {
            width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: .85em; flex-shrink: 0;
        }
        .lesson-num.completed { background: var(--green-bg); color: var(--green); border: 2px solid var(--green); }
        .lesson-num.in-progress { background: var(--yellow-bg); color: var(--yellow); border: 2px solid var(--yellow); }
        .lesson-num.not-started { background: var(--bg); color: var(--text-dim); border: 2px solid var(--border-strong); }
        .lesson-item a { color: var(--text); text-decoration: none; flex-grow: 1; font-weight: 500; }
        .lesson-item a:hover { color: var(--accent); }

        /* Content area */
        .content-area {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 36px; line-height: 1.8;
        }
        .content-area h1, .content-area h2, .content-area h3 { margin-top: 28px; margin-bottom: 12px; color: var(--text); }
        .content-area h1 { font-size: 1.7em; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .content-area h2 { font-size: 1.35em; }
        .content-area h3 { font-size: 1.12em; color: var(--accent); }
        .content-area p { margin-bottom: 16px; }
        .content-area a { text-decoration: none; border-bottom: 1px solid rgba(110,168,255,.4); }
        .content-area a:hover { border-bottom-color: var(--accent); }
        .content-area code {
            background: var(--code-bg); padding: 2px 7px; border-radius: 6px;
            font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace;
            font-size: .88em; border: 1px solid var(--border); color: #c9d6e3;
        }
        .content-area pre {
            background: var(--code-bg); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 18px; overflow-x: auto; margin-bottom: 18px;
        }
        .content-area pre code { background: none; border: none; padding: 0; }
        .content-area ul, .content-area ol { margin-left: 24px; margin-bottom: 16px; }
        .content-area li { margin-bottom: 6px; }
        .content-area blockquote {
            border-left: 3px solid var(--accent); padding: 4px 16px;
            color: var(--text-muted); margin-bottom: 16px; background: rgba(110,168,255,.05);
            border-radius: 0 8px 8px 0;
        }
        .content-area strong { color: var(--text); font-weight: 700; }
        .content-area table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
        .content-area th, .content-area td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        .content-area th { background: var(--bg-elevated); }

        /* Quiz */
        .quiz-question { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; }
        .quiz-question h3 { margin-bottom: 12px; }
        .quiz-option {
            display: block; padding: 11px 16px; margin: 8px 0;
            border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: all .18s;
        }
        .quiz-option:hover { background: var(--bg-card); border-color: var(--accent); }
        .quiz-option input[type="radio"] { margin-right: 10px; }
        .quiz-option.correct { background: var(--green-bg); border-color: var(--green); }
        .quiz-option.wrong { background: var(--red-bg); border-color: var(--red); }
        .explanation { background: var(--bg-card); border-left: 3px solid var(--accent); padding: 12px 16px; margin-top: 8px; font-size: .9em; color: var(--text-muted); border-radius: 0 8px 8px 0; }

        /* Task cards */
        .task-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
        .task-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .task-body { padding: 20px; }
        .hint-toggle, .solution-toggle {
            background: none; border: 1px solid var(--border-strong); color: var(--text-muted);
            padding: 6px 14px; border-radius: var(--radius-sm); cursor: pointer; margin-top: 8px; margin-right: 8px; font-size: .85em;
            transition: all .15s;
        }
        .hint-toggle:hover, .solution-toggle:hover { border-color: var(--accent); color: var(--accent); }
        .hint-content, .solution-content { display: none; margin-top: 12px; }

        /* Breadcrumbs */
        .breadcrumb { display: flex; gap: 8px; margin-bottom: 24px; color: var(--text-dim); font-size: .9em; flex-wrap: wrap; }
        .breadcrumb a { color: var(--text-muted); text-decoration: none; }
        .breadcrumb a:hover { color: var(--accent); }

        /* Lesson nav */
        .lesson-nav { display: flex; justify-content: space-between; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); gap: 12px; }

        /* ── Terminal (sandbox) ── */
        .term-wrap { border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; background: #05070a; box-shadow: var(--shadow); }
        .term-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); }
        .term-dot { width: 12px; height: 12px; border-radius: 50%; }
        .term-dot.r { background: #ff5f56; } .term-dot.y { background: #ffbd2e; } .term-dot.g { background: #27c93f; }
        .term-title { color: var(--text-dim); font-size: .8em; margin-left: 8px; font-family: ui-monospace, monospace; }
        .term-status { margin-left: auto; font-size: .72em; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
        .term-status .led { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
        .term-status.on .led { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .term-body {
            font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
            font-size: 13.5px; line-height: 1.55; color: #d6e2ee;
            padding: 14px 16px; height: 380px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
        }
        .term-body::-webkit-scrollbar { width: 10px; } .term-body::-webkit-scrollbar-thumb { background: #1d2530; border-radius: 8px; }
        .term-prompt { color: var(--green); } .term-cmd { color: #e6edf3; } .term-err { color: var(--red); } .term-dim { color: var(--text-dim); }
        .check-result { margin-top: 14px; padding: 14px 16px; border-radius: var(--radius-sm); font-size: .92em; display: none; }
        .check-result.pass { display:block; background: var(--green-bg); border: 1px solid var(--green); color: #9ff0ab; }
        .check-result.fail { display:block; background: var(--red-bg); border: 1px solid var(--red); color: #ffb4b0; }

        /* utils */
        .muted { color: var(--text-muted); }
        .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .mt-16 { margin-top: 16px; } .mb-0 { margin-bottom: 0; }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 0 16px; }
            .content-area { padding: 22px; }
            nav .nav-link { padding: 7px 9px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">TOT</a>
            <a href="/" class="nav-link" data-path="/">Дашборд</a>
            <a href="/courses" class="nav-link" data-path="/courses">Курсы</a>
            <a href="/roadmap" class="nav-link" data-path="/roadmap">Roadmap</a>
            <a href="/playground" class="nav-link" data-path="/playground">Go Playground</a>
            <a href="/git-trainer" class="nav-link" data-path="/git-trainer">Git Trainer</a>
            <a href="/logout" class="nav-link spacer">Выход</a>
        </div>
    </nav>
    <main>
        <div class="container">
            {{template "content" .}}
        </div>
    </main>
    <script>
        // Mark active nav link
        (function () {
            var p = location.pathname;
            document.querySelectorAll('nav .nav-link[data-path]').forEach(function (a) {
                var dp = a.getAttribute('data-path');
                if (dp === '/' ? p === '/' : p.indexOf(dp) === 0) a.classList.add('active');
            });
        })();

        function toggleElement(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        async function updateProgress(lessonID, status) {
            await fetch('/api/progress/' + lessonID + '/status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({status: status})
            });
            location.reload();
        }
    </script>
</body>
</html>
{{end}}
