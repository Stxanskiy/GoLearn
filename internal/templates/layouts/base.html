{{define "base"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.PageTitle}}</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2128;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --green: #3fb950;
            --green-bg: #0d2818;
            --yellow: #d29922;
            --yellow-bg: #2d1f00;
            --red: #f85149;
            --red-bg: #2d0e0e;
            --purple: #bc8cff;
            --code-bg: #0d1117;
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        /* Navigation */
        nav {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .container {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        nav .logo {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }
        nav .logo span { color: var(--text-muted); font-weight: 400; }
        nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
        nav a:hover { color: var(--text); }

        /* Main content */
        main { padding: 32px 0; }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: var(--accent); }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.2;
        }
        .stat-label {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-top: 4px;
        }

        /* Progress bar */
        .progress-bar {
            background: var(--bg);
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            background: var(--green);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* Status badges */
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
        }
        .badge-completed { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
        .badge-in-progress { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow); }
        .badge-not-started { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 8px 20px;
            border-radius: var(--radius);
            font-size: 0.95em;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success {
            background: var(--green);
            color: #fff;
            border-color: var(--green);
        }
        .btn-outline {
            background: transparent;
            color: var(--text);
        }
        .btn-outline:hover { background: var(--bg-secondary); }

        /* Lesson list */
        .lesson-list { list-style: none; }
        .lesson-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        .lesson-item:hover { background: var(--bg-secondary); }
        .lesson-item:last-child { border-bottom: none; }
        .lesson-num {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85em;
            flex-shrink: 0;
        }
        .lesson-num.completed { background: var(--green-bg); color: var(--green); border: 2px solid var(--green); }
        .lesson-num.in-progress { background: var(--yellow-bg); color: var(--yellow); border: 2px solid var(--yellow); }
        .lesson-num.not-started { background: var(--bg); color: var(--text-muted); border: 2px solid var(--border); }
        .lesson-item a {
            color: var(--text);
            text-decoration: none;
            flex-grow: 1;
        }
        .lesson-item a:hover { color: var(--accent); }

        /* Content area */
        .content-area {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            line-height: 1.8;
        }
        .content-area h1, .content-area h2, .content-area h3 {
            margin-top: 24px;
            margin-bottom: 12px;
            color: var(--text);
        }
        .content-area h1 { font-size: 1.8em; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .content-area h2 { font-size: 1.4em; }
        .content-area h3 { font-size: 1.15em; }
        .content-area p { margin-bottom: 16px; }
        .content-area code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9em;
            border: 1px solid var(--border);
        }
        .content-area pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            overflow-x: auto;
            margin-bottom: 16px;
        }
        .content-area pre code {
            background: none;
            border: none;
            padding: 0;
        }
        .content-area ul, .content-area ol {
            margin-left: 24px;
            margin-bottom: 16px;
        }
        .content-area blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 16px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .content-area strong { color: var(--accent); }

        /* Quiz */
        .quiz-question {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }
        .quiz-question h3 { margin-bottom: 12px; }
        .quiz-option {
            display: block;
            padding: 10px 16px;
            margin: 6px 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s;
        }
        .quiz-option:hover { background: var(--bg-card); border-color: var(--accent); }
        .quiz-option input[type="radio"] { margin-right: 10px; }
        .quiz-option.correct { background: var(--green-bg); border-color: var(--green); }
        .quiz-option.wrong { background: var(--red-bg); border-color: var(--red); }
        .explanation {
            background: var(--bg-card);
            border-left: 3px solid var(--accent);
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        /* Task cards */
        .task-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 16px;
        }
        .task-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-body { padding: 20px; }
        .hint-toggle, .solution-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: var(--radius);
            cursor: pointer;
            margin-top: 8px;
            margin-right: 8px;
        }
        .hint-toggle:hover, .solution-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .hint-content, .solution-content { display: none; margin-top: 12px; }

        /* Breadcrumbs */
        .breadcrumb {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            color: var(--text-muted);
            font-size: 0.9em;
        }
        .breadcrumb a { color: var(--accent); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        /* Navigation between lessons */
        .lesson-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 0 16px; }
            .content-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">GoLearn <span>LMS</span></a>
            <a href="/">Dashboard</a>
        </div>
    </nav>
    <main>
        <div class="container">
            {{template "content" .}}
        </div>
    </main>
    <script>
        function toggleElement(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        async function updateProgress(lessonID, status) {
            await fetch('/api/progress/' + lessonID + '/status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({status: status})
            });
            location.reload();
        }
    </script>
</body>
</html>
{{end}}
