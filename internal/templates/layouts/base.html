{{define "base"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.PageTitle}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <nav>
        <div class="container nav-inner">
            <a href="/" class="logo" title="TOT">
                <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="url(#tot-g)"/>
                    <path d="M9 11l5 5-5 5" stroke="#0a0c10" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16.5 21H23" stroke="#0a0c10" stroke-width="2.6" stroke-linecap="round"/>
                    <defs><linearGradient id="tot-g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6ea8ff"/><stop offset="1" stop-color="#b98cff"/></linearGradient></defs>
                </svg>
                <span class="logo-text">TOT</span>
            </a>
            <div class="nav-main">
                <a href="/" class="nav-link" data-path="/">Прогресс</a>
                <a href="/roadmap" class="nav-link" data-path="/roadmap">Маршрут</a>
                <a href="/courses" class="nav-link" data-path="/courses">Курсы</a>
                <a href="/trainers" class="nav-link" data-path="/trainers">Тренажёры</a>
                <a href="/simulators" class="nav-link" data-path="/simulators">Симуляторы</a>
            </div>
            <div class="nav-side">
                <a href="/admin" class="nav-link nav-admin" data-path="/admin" id="nav-admin" style="display:none;">⚙ Админка</a>
                <a href="/logout" class="nav-link nav-exit" title="Выйти из аккаунта">Выход</a>
            </div>
        </div>
    </nav>
    <main>
        <div class="container">
            {{template "content" .}}
        </div>
    </main>
    <script>
        // Mark active nav link + reveal admin link for admins
        (function () {
            var p = location.pathname;
            document.querySelectorAll('nav .nav-link[data-path]').forEach(function (a) {
                var dp = a.getAttribute('data-path');
                if (dp === '/' ? p === '/' : p.indexOf(dp) === 0) a.classList.add('active');
            });
            if (/(^|;\s*)gl_role=admin/.test(document.cookie)) {
                var na = document.getElementById('nav-admin'); if (na) na.style.display = '';
            }
        })();

        function toggleElement(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        async function updateProgress(lessonID, status) {
            await fetch('/api/progress/' + lessonID + '/status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({status: status})
            });
            location.reload();
        }
    </script>
</body>
</html>
{{end}}
