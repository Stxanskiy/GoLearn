{{define "admin_task"}}
{{template "base" .}}
{{end}}

{{define "content"}}
<div class="breadcrumb"><a href="/admin">Админка</a> / <a href="/admin/lesson/{{.LessonID}}">Глава</a> / <span>{{if .IsNew}}Новое задание{{else}}{{.Task.Title}}{{end}}</span></div>
<h1 style="margin-bottom:18px;">{{if .IsNew}}Новое задание{{else}}Задание: {{.Task.Title}}{{end}}</h1>

<form class="adm-form" method="POST" action="{{if .IsNew}}/admin/task{{else}}/admin/task/{{.Task.ID}}{{end}}">
    <input type="hidden" name="lesson_id" value="{{.LessonID}}">
    <div class="adm-grid">
        <label>Заголовок<input name="title" value="{{.Task.Title}}" required></label>
        <label>Тип
            <select name="kind">
                {{$k := .Task.Kind}}
                <option value="shell"{{if eq $k "shell"}} selected{{end}}>shell (терминал)</option>
                <option value="go"{{if eq $k "go"}} selected{{end}}>go (код)</option>
            </select>
        </label>
        <label>Сложность
            <select name="difficulty">
                {{$d := .Task.Difficulty}}
                <option value="easy"{{if eq $d "easy"}} selected{{end}}>easy</option>
                <option value="medium"{{if eq $d "medium"}} selected{{end}}>medium</option>
                <option value="hard"{{if eq $d "hard"}} selected{{end}}>hard</option>
            </select>
        </label>
        <label>Sandbox image<input name="sandbox_image" value="{{.Task.SandboxImage}}" placeholder="ubuntu:24.04"></label>
        <label class="full">Описание (HTML)<textarea name="description" rows="4">{{.Task.Description}}</textarea></label>
        <label class="full">Подсказка (HTML)<textarea name="hints" rows="2">{{.Task.Hints}}</textarea></label>
        <label class="full">Решение (HTML)<textarea name="solution" rows="2">{{.Task.Solution}}</textarea></label>
        <label class="full">Starter code (для go)<textarea name="starter_code" rows="4" style="font-family:monospace;">{{.Task.StarterCode}}</textarea></label>
        <label class="full">Setup script (bash, выполняется при старте песочницы)<textarea name="setup_script" rows="3" style="font-family:monospace;">{{.Task.SetupScript}}</textarea></label>
        <label class="full">Check script (bash; exit 0 = задание выполнено)<textarea name="check_script" rows="3" style="font-family:monospace;">{{.Task.CheckScript}}</textarea></label>
    </div>
    <div class="row" style="margin-top:14px;">
        <button class="btn btn-primary" type="submit">Сохранить</button>
        <a href="/admin/lesson/{{.LessonID}}" class="btn btn-ghost">Отмена</a>
    </div>
</form>

<style>
.adm-form .adm-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.adm-form label { display:flex; flex-direction:column; gap:5px; font-size:.84em; font-weight:600; color:var(--text-muted); }
.adm-form label.full { grid-column:1 / -1; }
.adm-form input, .adm-form select, .adm-form textarea { background:var(--bg-elevated); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:9px; font-size:1em; font-family:inherit; outline:none; }
.adm-form input:focus, .adm-form select:focus, .adm-form textarea:focus { border-color:var(--accent); }
@media (max-width:680px){ .adm-form .adm-grid { grid-template-columns:1fr; } }
</style>
{{end}}
